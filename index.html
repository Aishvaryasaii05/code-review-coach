<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Review Coach - Getting Started</title>
  <meta http-equiv="refresh" content="0; url=frontend/index.html">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 2rem;
    }
    .container {
      max-width: 600px;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 2rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }
    p {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 2rem;
    }
    .manual-link {
      display: inline-block;
      background: white;
      color: #667eea;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s;
    }
    .manual-link:hover {
      transform: translateY(-2px);
    }
    .instructions {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(255,255,255,0.3);
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loader"></div>
    <h1>🚀 Code Review Coach</h1>
    <p>Redirecting to the application...</p>
    <p>If not redirected, <a href="frontend/index.html" class="manual-link">click here</a></p>
    
    <div class="instructions">
      <p><strong>First time here?</strong></p>
      <p>Make sure to run the servers first:</p>
      <p><code style="background: rgba(0,0,0,0.3); padding: 0.5rem 1rem; border-radius: 6px; display: inline-block; margin-top: 0.5rem;">npm start</code></p>
      <p style="margin-top: 1rem; font-size: 0.85rem;">See README.md for setup instructions</p>
    </div>
  </div>
</body>
</html>
