services:
  - type: web
    name: code-review-coach
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://api.openai.com/v1/chat/completions
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: ALLOWED_ORIGINS
        value: https://code-review-coach.onrender.com
